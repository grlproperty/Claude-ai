# Builds the site and publishes it to GitHub Pages on every push to the default
# branch. The build is hermetic — fonts, imagery, and content are all in the
# repository, so nothing is fetched at build time.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run check

      # Pages must be switched on for the repository before this can publish:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # enablement asks the action to create the Pages site itself, and it
      # cannot with the workflow's own token — "Create Pages site failed:
      # Resource not accessible by integration". Creating one needs
      # administration:write, which GitHub withholds from GITHUB_TOKEN and
      # which the permissions block above cannot grant. Left set because it
      # costs nothing, is a no-op once Pages exists, and would work if this
      # step were ever handed a token that carries the scope.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
