# Runs the same build and verification on pull requests, so a broken link, a
# missing alt attribute, or a contrast regression is caught before merge rather
# than after deploy.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run check
