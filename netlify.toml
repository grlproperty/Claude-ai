# Host configuration. The site is a plain directory of HTML, so this is only
# telling the host how to build it and where the output lands.
#
# Nothing here is Netlify-specific in substance — Cloudflare Pages takes the
# same two values in its dashboard (build command, output directory), and any
# host that can run Node will do.

[build]
  command = "npm run build && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# dist/_redirects is generated by the build and honoured natively here, so the
# legacy /rss.xml, /feed and /research/ addresses resolve without the HTML
# refresh pages the build also emits for hosts that ignore it.
#
# dist/404.html is picked up automatically for unknown paths.
